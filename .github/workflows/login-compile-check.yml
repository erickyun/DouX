name: Compile login-compatibility DouX

on:
  push:
    branches:
      - feature/login-compatibility-20261122
    paths:
      - 'hooks/**'
      - 'DouXManager.*'
      - 'DouXLoginDiagnostics.h'
      - 'Settings/**'
      - 'Makefile'
      - '.github/workflows/login-compile-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fLsS \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Compile from current branch without any TikTok IPA
        shell: bash
        run: |
          set -euo pipefail
          git apply scripts/compile_jgprogresshud.patch
          if [ -d layout/DEBIAN ]; then mv layout/DEBIAN layout/DEBIAN.bak; fi
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload test tweak package
        uses: actions/upload-artifact@v4
        with:
          name: DouX-login-test-deb-${{ github.run_number }}
          path: packages/*.deb
          if-no-files-found: error
